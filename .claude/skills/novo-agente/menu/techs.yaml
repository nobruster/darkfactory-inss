python:
  display_name: Python
  description: "Python — a linguagem do pipeline: ingestão, transformação, evals, operador. 13 scripts, ~1.400 linhas."
  primary_language: python
  threshold_architect: 0.90
  threshold_developer: 0.95
  color_architect: blue
  color_developer: blue
  capabilities_architect:
    - "Decidir o que vira script novo vs função em script existente — a fábrica prefere scripts pequenos com uma responsabilidade"
    - "Planejar processamento de 11,7 GB em memória constante (ver ingest_bronze.py)"
    - "Desenhar o packet de evidência: que campos provam o que aconteceu"
    - "Decidir o que é gate (reprova a execução) vs observação medida (registra e segue)"
  capabilities_developer:
    - "Decimal em todo caminho monetário — float é gate reprovado (ADR 0002)"
    - "Streaming com TextIOWrapper: `for linha in arquivo`, nunca `.read()` (ver perfil_cobertura.py)"
    - "Publicação atômica: escreve em `.parcial`, roda os gates, só então `rename` (ver build_silver.py)"
    - "argparse com `--competencia` — nenhum script assume a competência do contrato"
    - "Packet JSON por execução em `evidence/<camada>-<AAAAMM>.json`, com os gates que passaram"
    - "Gate que compara contra o contrato só quando a competência é a declarada; senão vira medição"
  maxim: "Streaming por padrão. Decimal em dinheiro. Publicação atômica ou nenhuma."
  mission_architect: "Desenhar código que falha alto quando o dado está errado."
  mission_developer: "Entregar script que recusa publicar quando um gate reprova."

