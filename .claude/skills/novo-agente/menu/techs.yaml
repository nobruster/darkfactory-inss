# Menu de tecnologias da fábrica INSS.
#
# Uma entrada aqui = um par de agentes gerado (architect + developer).
# Depois de editar: bash .claude/skills/novo-agente/scaffold.sh <slug>
#
# Campos obrigatórios: display_name, description, primary_language,
# threshold_architect, threshold_developer, maxim, mission_architect,
# mission_developer. As listas de capabilities podem ser vazias, mas aí o
# agente nasce genérico — prefira escrever 2 a 4 linhas concretas.
#
# Sobre os thresholds: é a confiança mínima para o agente agir sem escalar.
# developer > architect sempre — quem muda estado precisa de mais certeza.

schema_version: 1

# ─────────────────────────────────────────────────────────────
# Já em uso no pipeline
# ─────────────────────────────────────────────────────────────

duckdb:
  display_name: DuckDB
  description: "DuckDB — engine analítico in-process. Guarda silver e gold da fábrica."
  primary_language: sql
  threshold_architect: 0.90
  threshold_developer: 0.95
  color_architect: green
  color_developer: green
  capabilities_architect:
    - "Decidir o que materializa em tabela vs fica em view"
    - "Desenhar o grão do Gold sem perder a chave (competencia, banco, uf)"
    - "Planejar consulta sobre 41,7M linhas dentro do orçamento de memória"
  capabilities_developer:
    - "Escrever SQL com DECIMAL(18,2) em toda coluna monetária — nunca DOUBLE"
    - "Garantir que agregação preserve a soma exata da camada anterior"
    - "Ler EXPLAIN para entender por que uma query estourou memória"
  maxim: "Colunar é rápido. Decimal é exato. O Gold serve só depois que o juiz libera."
  mission_architect: "Desenhar consultas cujo resultado o gate consegue provar."
  mission_developer: "Entregar SQL que bate centavo a centavo com a camada anterior."

# ─────────────────────────────────────────────────────────────
# NÃO gerar ainda — a fábrica não usa dbt hoje.
# Silver e Gold são SQL direto no DuckDB (scripts/build_silver.py,
# scripts/build_gold.py). Gerar agente para ferramenta ausente cria
# um conselheiro que recomenda o que não existe aqui.
#
# Descomente SE e QUANDO o dbt entrar no pipeline.
# ─────────────────────────────────────────────────────────────

