[project]
name = "darkfactory-inss"
version = "0.1.0"
description = "Fábrica de dados: concentração bancária em benefícios do INSS, por UF"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=25,<26",   # 25.x codifica o Parquet do landing — outra versão muda os bytes
    "pyyaml>=6",
    "openpyxl>=3.1",     # lê os dicionários oficiais do INSS (.xlsx)
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
]
ignore = [
    "E501",  # line-length já é checado pelo formatter
]

[tool.ruff.lint.per-file-ignores]
# Scripts de perfilamento: rodam uma vez, medem, imprimem e morrem.
# `E701`/`E702` (statement na mesma linha) e `SIM115` (open sem context
# manager) são legítimos aqui — o processo termina logo depois.
# O que NÃO se ignora em lugar nenhum: F821 (nome indefinido) e B (bugs).
"scripts/perfil_cobertura.py" = ["E701", "E702", "SIM115"]
"scripts/totais_controle.py" = ["E701", "E702", "SIM115"]

# Lambda de conveniência para consulta DuckDB: `q = lambda s: ...`.
# Trocar por def aqui tornaria o código mais longo sem ficar mais claro.
"scripts/build_silver.py" = ["E731"]
"scripts/build_gold.py" = ["E731"]
"scripts/eval_doutrina.py" = ["E731"]
"scripts/ancorar_bronze.py" = ["E731"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integracao: exige lakehouse construído (pule com -m 'not integracao')",
]
